<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" className="w-auto h-full">
  <defs>
    <linearGradient id="adrydYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF24D" />
      <stop offset="100%" stop-color="#FFE500" />
    </linearGradient>
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aerodynamic Triple-Blade Speed Dart Symbol -->
  <g transform="translate(4, 4)">
    <!-- Top Blade -->
    <path d="M 12 4 L 46 22 L 28 24 L 2 12 Z" fill="url(#adrydYellowGrad)" />
    <!-- Center Dart -->
    <path d="M 0 25 L 56 25 L 42 34 L 8 34 Z" fill="#FFE500" />
    <!-- Bottom Blade -->
    <path d="M 6 46 L 44 35 L 26 33 L 14 53 Z" fill="url(#adrydYellowGrad)" />
  </g>

  <!-- Wordmark Group -->
  <g transform="translate(68, 6)">
    <!-- Letter 'A' (Custom dynamic angled cut) -->
    <path d="M 2 34 L 14 2 L 27 2 L 39 34 L 29 34 L 25 24 L 14 24 L 10 34 Z M 16 17 L 22 17 L 19 8 Z" fill="#FFFFFF" />

    <!-- Letter 'D' -->
    <path d="M 41 2 L 57 2 C 67 2 73 7 71 18 C 69 29 61 34 50 34 L 35 34 Z M 48 9 L 45 27 L 51 27 C 57 27 61 24 62 18 C 63 12 60 9 55 9 Z" fill="#FFFFFF" />

    <!-- Letter 'R' (Electric Yellow) -->
    <path d="M 76 2 L 93 2 C 101 2 105 6 104 14 C 103 20 98 23 93 24 L 102 34 L 91 34 L 83 25 L 81 25 L 77 34 L 68 34 Z M 83 9 L 80 19 L 87 19 C 92 19 95 17 95 14 C 95 11 93 9 88 9 Z" fill="#FFE500" />

    <!-- Letter 'Y' (Electric Yellow) -->
    <path d="M 103 2 L 112 2 L 116 16 L 126 2 L 136 2 L 121 21 L 116 34 L 107 34 L 112 21 Z" fill="#FFE500" />

    <!-- Letter 'D' (Electric Yellow) -->
    <path d="M 137 2 L 153 2 C 163 2 169 7 167 18 C 165 29 157 34 146 34 L 131 34 Z M 144 9 L 141 27 L 147 27 C 153 27 157 24 158 18 C 159 12 156 9 151 9 Z" fill="#FFE500" />

    <!-- Registered Trademark ® -->
    <g transform="translate(172, 3)">
      <circle cx="5" cy="5" r="4.5" stroke="#FFE500" stroke-width="0.8" fill="none" />
      <text x="5" y="7.2" font-family="'Inter', sans-serif" font-size="5" font-weight="bold" fill="#FFE500" text-anchor="middle">R</text>
    </g>

    <!-- Subtitle: Ride. Promote. Sell. Grow. -->
    <text x="2" y="47" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" font-style="italic" letter-spacing="0.14em" fill="#F7F5F0" opacity="0.95">
      Ride. Promote. Sell. Grow.
    </text>
  </g>
</svg>
